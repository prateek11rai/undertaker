name: test

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "**/*.png", "**/*.svg", "**/*.jpg"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "**/*.png", "**/*.svg", "**/*.jpg"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.12.3
      - run: uv sync --frozen --python "$(command -v python)"
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  temporal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.12.3
      - run: uv sync --frozen --python "$(command -v python)"
      - name: Install the Temporal CLI with the runner's Homebrew
        run: /home/linuxbrew/.linuxbrew/bin/brew install temporal
      - run: uv run pytest -m temporal
        env:
          UNDERTAKER_TEMPORAL_BIN: /home/linuxbrew/.linuxbrew/bin/temporal
