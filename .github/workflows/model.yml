name: model

on:
  push:
    branches: [main]
    paths: ["src/undertaker/explain/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemma:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.12.3
      - run: uv sync --frozen --python "$(command -v python)"
      - name: Ollama and gemma4:e4b with the runner's Homebrew
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install ollama
          /home/linuxbrew/.linuxbrew/bin/ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 1; done
          /home/linuxbrew/.linuxbrew/bin/ollama pull gemma4:e4b
      - run: uv run pytest -m model -s
