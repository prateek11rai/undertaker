[project]
name = "undertaker"
version = "0.1.0"
description = "Finds the Temporal workflows that will never finish and writes a checked certificate of undeath for each, with a local Gemma."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "temporalio==1.34.0",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "pydantic==2.14.1",
]

[project.scripts]
undertaker = "undertaker.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/undertaker"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv]
exclude-newer = "2026-10-25T00:00:00Z"
python-downloads = "never"
python-preference = "only-system"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "temporal: needs /opt/homebrew/bin/temporal",
    "model: needs Ollama with gemma4:e4b",
]
addopts = "-m 'not temporal and not model'"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
